name: Dev Hardware Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: dev-hardware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dev-blocking:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    env:
      SIXTYOPS_TEST_URL: ${{ vars.SIXTYOPS_TEST_URL || secrets.SIXTYOPS_TEST_URL }}
      SIXTYOPS_TEST_USER: ${{ vars.SIXTYOPS_TEST_USER || secrets.SIXTYOPS_TEST_USER }}
      SIXTYOPS_TEST_PASS: ${{ secrets.SIXTYOPS_TEST_PASS }}
      SIXTYOPS_TEST_AP_IP: ${{ vars.SIXTYOPS_TEST_AP_IP || secrets.SIXTYOPS_TEST_AP_IP }}
      SIXTYOPS_TEST_SWITCH_IP: ${{ vars.SIXTYOPS_TEST_SWITCH_IP || secrets.SIXTYOPS_TEST_SWITCH_IP }}
      SIXTYOPS_TEST_FIRMWARE_AP_IP: ${{ vars.SIXTYOPS_TEST_FIRMWARE_AP_IP || secrets.SIXTYOPS_TEST_FIRMWARE_AP_IP }}
      SIXTYOPS_TEST_CONFIG_AP_IP: ${{ vars.SIXTYOPS_TEST_CONFIG_AP_IP || secrets.SIXTYOPS_TEST_CONFIG_AP_IP }}
      SIXTYOPS_TEST_RADIUS_AP_IP: ${{ vars.SIXTYOPS_TEST_RADIUS_AP_IP || secrets.SIXTYOPS_TEST_RADIUS_AP_IP }}
    steps:
      - uses: actions/checkout@v4

      - name: Lock shared dev host and run validation
        run: |
          lock_dir="${RUNNER_WORKSPACE:?RUNNER_WORKSPACE is not set}/.locks"
          mkdir -p "$lock_dir"
          exec 9>"$lock_dir/sixtyops-dev-hardware.lock"
          if ! flock --exclusive --wait 900 9; then
            echo "::error::Timed out after 15 minutes waiting for the shared dev host lock."
            exit 1
          fi

          echo "Acquired the shared dev host lock."
          missing=()
          for name in \
            SIXTYOPS_TEST_URL \
            SIXTYOPS_TEST_USER \
            SIXTYOPS_TEST_PASS \
            SIXTYOPS_TEST_AP_IP \
            SIXTYOPS_TEST_SWITCH_IP \
            SIXTYOPS_TEST_FIRMWARE_AP_IP \
            SIXTYOPS_TEST_CONFIG_AP_IP \
            SIXTYOPS_TEST_RADIUS_AP_IP
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            python3 -m venv .venv
            . .venv/bin/activate
            pip install -r requirements.txt
            pytest -m "integration and dev_blocking" -v --timeout=900
          else
            missing_csv="$(IFS=,; echo "${missing[*]}")"
            echo "::warning::Skipping live-dev validation because required inputs are not configured: $missing_csv"
            {
              echo "### Dev Hardware Validation skipped"
              echo
              echo "Required live-dev inputs are not configured for this repository or environment."
              echo
              echo "Missing inputs: \`$missing_csv\`"
              echo
              echo "Live-dev validation is soft-skipped until the live-dev secrets or variables are wired (tracked in issue #117). Re-run after secrets are populated."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
