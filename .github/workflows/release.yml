name: Release

on:
  push:
    tags:
      - "v*-dev*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0). Must already exist."
        required: true
        type: string
      confirm:
        description: "Type RELEASE to confirm stable release"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_EVENT: ${{ github.event_name }}

jobs:
  validate-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Validate confirmation
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$RELEASE_CONFIRM" != "RELEASE" ]; then
            echo "::error::You must type RELEASE to confirm."
            exit 1
          fi

      - name: Reject dev tags
        run: |
          TAG="$RELEASE_TAG"
          if echo "$TAG" | grep -q -- "-dev"; then
            echo "::error::Use tag push for dev releases, not workflow_dispatch"
            exit 1
          fi

  test:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    if: always() && (needs.validate-dispatch.result == 'success' || needs.validate-dispatch.result == 'skipped')
    needs: [validate-dispatch]
    steps:
      - name: Validate release tag
        run: |
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Stable releases require a vX.Y.Z tag."
              exit 1
            fi
          elif [ "$RELEASE_EVENT" = "push" ]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev[0-9]+$ ]]; then
              echo "::error::Dev releases require a vX.Y.Z-devN tag."
              exit 1
            fi
          else
            echo "::error::Unsupported release event."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt
          pytest -v --timeout=60

  release:
    needs: [test]
    if: always() && needs.test.result == 'success'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        run: |
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Stable releases require a vX.Y.Z tag."
              exit 1
            fi
          elif [ "$RELEASE_EVENT" = "push" ]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev[0-9]+$ ]]; then
              echo "::error::Dev releases require a vX.Y.Z-devN tag."
              exit 1
            fi
          else
            echo "::error::Unsupported release event."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      # Defense-in-depth gate (mirrors the client-side check in
      # updater/release_checker.py): a release at/after the signing cutover MUST
      # carry a valid GPG signature from a trusted key, or it is never published
      # — no GitHub Release, no GHCR image. Older tags predate signing and pass
      # through. Keep CUTOVER in sync with MIN_SIGNED_VERSION.
      # See docs/self-update-signing.md.
      - name: Verify release tag is signed by a trusted key
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VER="${TAG#v}"
          CUTOVER="1.4.0"  # keep in sync with release_checker.py MIN_SIGNED_VERSION
          # Version compare without pip (the runner's Python is externally
          # managed, PEP 668): VER >= CUTOVER iff the lowest of the two under
          # version sort is CUTOVER. sort -V differs from PEP 440 only for
          # pre-releases of 1.4.0 itself, where it over-enforces — the safe
          # direction (we never cut 1.4.0-dev tags).
          if [ "$(printf '%s\n%s\n' "$CUTOVER" "$VER" | sort -V | head -1)" != "$CUTOVER" ]; then
            echo "Tag $TAG predates the signing cutover $CUTOVER — skipping signature gate (legacy)."
            exit 0
          fi
          # actions/checkout rewrites refs/tags/<tag> to point at the bare
          # commit, which breaks verify-tag ("cannot verify a non-tag object").
          # Re-fetch the real annotated tag object from origin first.
          git fetch origin --force "refs/tags/${TAG}:refs/tags/${TAG}"
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          gpg --batch --quiet --import updater/trusted_keys/*.asc
          if git -c gpg.format=openpgp verify-tag "$TAG"; then
            echo "Tag $TAG carries a trusted release signature."
          else
            echo "::error::Release tag $TAG is not signed by a trusted release key. Refusing to publish. Sign it with 'git tag -s' using the release key (see docs/self-update-signing.md)."
            exit 1
          fi

      - name: Determine release type
        id: meta
        run: |
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            TAG="$RELEASE_TAG"
            {
              echo "is_prerelease=false"
              echo "tag=$TAG"
              echo "name=$TAG"
            } >> "$GITHUB_OUTPUT"
          else
            TAG="$RELEASE_TAG"
            {
              echo "is_prerelease=true"
              echo "tag=$TAG"
              echo "name=$TAG (dev)"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Generate dev release notes
        if: steps.meta.outputs.is_prerelease == 'true'
        run: |
          TAG="$RELEASE_TAG"
          PREV_TAG=$(git tag --sort=-v:refname | grep -F -x -A1 -- "$TAG" | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG" ]; then
            PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          fi
          COMMITS=$(git log --pretty=format:"- %s" "${PREV_TAG}..${TAG}" -- . ':!website' 2>/dev/null || echo "- No changes")
          {
            echo "## Changes since ${PREV_TAG}"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "---"
            echo "**Docker image:** \`ghcr.io/sixtyops/manager:${TAG}\`"
          } > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          generate_release_notes: ${{ steps.meta.outputs.is_prerelease == 'false' }}
          body_path: ${{ steps.meta.outputs.is_prerelease == 'true' && '/tmp/release-notes.md' || '' }}

  docker-push:
    needs: [release]
    if: always() && needs.release.result == 'success'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate release tag
        run: |
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Stable releases require a vX.Y.Z tag."
              exit 1
            fi
          elif [ "$RELEASE_EVENT" = "push" ]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev[0-9]+$ ]]; then
              echo "::error::Dev releases require a vX.Y.Z-devN tag."
              exit 1
            fi
          else
            echo "::error::Unsupported release event."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          TAG="$RELEASE_TAG"
          TAGS="ghcr.io/sixtyops/manager:${TAG}"
          # Floating tags: :latest on stable cuts, :dev on every dev push.
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ]; then
            TAGS="${TAGS},ghcr.io/sixtyops/manager:latest"
          else
            TAGS="${TAGS},ghcr.io/sixtyops/manager:dev"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
